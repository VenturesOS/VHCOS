[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ─── vLLM serving Qwen14B-AWQ on port 8000 ──────────────────────────────────
[program:vllm]
command=python -m vllm.entrypoints.openai.api_server
    --model %(ENV_VHC_VLLM_MODEL)s
    --host 0.0.0.0
    --port %(ENV_VHC_VLLM_PORT)s
    --max-model-len %(ENV_VHC_VLLM_MAX_MODEL_LEN)s
    --gpu-memory-utilization 0.85
    --enforce-eager
autostart=true
autorestart=true
startsecs=15
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/vllm.out.log
stderr_logfile=/var/log/vllm.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ─── BGE bi/cross encoder sidecar on port 8001 ──────────────────────────────
[program:bge_sidecar]
command=uvicorn embed_service:app --host 0.0.0.0 --port %(ENV_VHC_SIDECAR_PORT)s --log-level info
directory=/opt/vhc
autostart=true
autorestart=true
startsecs=20
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/sidecar.out.log
stderr_logfile=/var/log/sidecar.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
