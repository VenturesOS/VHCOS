name: Build & push BGE sidecar image

on:
  push:
    branches: [main]
    paths:
      - "runpod-sidecar/**"
      - ".github/workflows/build-sidecar.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: runpod-sidecar
          file: runpod-sidecar/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/vhc-bge-sidecar:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/vhc-bge-sidecar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
