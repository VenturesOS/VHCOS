name: Secret Scan (gitleaks)

# Fail-fast guardrail: blocks any commit or PR that reintroduces a hardcoded
# credential — e.g. the MongoDB Atlas password purge we did in July 2026.
# Runs on every push + PR against main.
#
# Docs: https://github.com/gitleaks/gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan sees older commits too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
